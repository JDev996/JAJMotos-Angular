<div class="container-fluid bg-light min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 15px;">
    
    <!-- Encabezado -->
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">JAJ MOTOS</h2>
      <p class="text-muted">Ingresa a tu cuenta</p>
    </div>

    <!-- Formulario -->
    <form>
      
      <!-- Campo Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input 
          type="email" 
          class="form-control" 
          id="email" 
          name="email"
          placeholder="ejemplo@correo.com"
          required>
      </div>

      <!-- Campo Contraseña -->
      <div class="mb-4">
        <label for="password" class="form-label">Contraseña</label>
        <input 
          type="password" 
          class="form-control" 
          id="password" 
          name="password"
          placeholder="********"
          required>
      </div>

      <!-- Botón -->
      <div class="d-grid gap-2">
        <a routerLink="/home" class="btn btn-primary btn-lg">
          Iniciar Sesión
        </a>
      </div>

      <div class="text-center mt-3">
        <!-- Cambié /registro por /contacto que SÍ existe -->
        <a routerLink="/contacto" class="text-decoration-none small text-secondary">
          ¿No tienes cuenta? Contáctanos
        </a>
      </div>
      
      <div class="text-center mt-2">
        <a routerLink="/home" class="text-decoration-none small text-secondary">
          Volver al inicio
        </a>
      </div>

    </form>
  </div>
</div>
